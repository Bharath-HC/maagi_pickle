{% extends "customer/_layout.html" %}
{% block dash_content %}
<h3 class="mb-4">My Wishlist</h3>
{% if items %}
<div class="row g-4">
  {% for w in items %}
  <div class="col-md-4">
    <div class="dash-card">
      <h6><a href="{{ url_for('products.detail', slug=w.product.slug) }}">{{ w.product.name }}</a></h6>
      <p class="text-muted small">{{ w.product.short_description }}</p>
      <form method="post" action="{{ url_for('customer.wishlist_toggle', product_id=w.product.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
      </form>
    </div>
  </div>
  {% endfor %}
</div>
{% else %}
<p class="text-muted">Your wishlist is empty. <a href="{{ url_for('products.catalog') }}">Browse products</a></p>
{% endif %}
{% endblock %}
