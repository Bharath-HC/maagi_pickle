{% if pagination and pagination.pages > 1 %}
<nav aria-label="Pagination" class="my-4">
  <ul class="pagination justify-content-center">
    <li class="page-item {{ 'disabled' if not pagination.has_prev else '' }}">
      <a class="page-link" href="{{ url_for_page(pagination.prev_num) if pagination.has_prev else '#' }}">Previous</a>
    </li>
    {% for p in pagination.iter_pages(left_edge=1, right_edge=1, left_current=1, right_current=2) %}
      {% if p %}
        <li class="page-item {{ 'active' if p == pagination.page else '' }}">
          <a class="page-link" href="{{ url_for_page(p) }}">{{ p }}</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">&hellip;</span></li>
      {% endif %}
    {% endfor %}
    <li class="page-item {{ 'disabled' if not pagination.has_next else '' }}">
      <a class="page-link" href="{{ url_for_page(pagination.next_num) if pagination.has_next else '#' }}">Next</a>
    </li>
  </ul>
</nav>
{% endif %}
